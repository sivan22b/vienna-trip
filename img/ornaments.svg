<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- קישוטי רקע עדינים: זר, מקל סוכריה, פתיתי שלג, אייל -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- זר -->
    <g transform="translate(52 56)" opacity=".16">
      <circle r="20" stroke="#1f4d36" stroke-width="7" stroke-dasharray="3 4"/>
      <circle r="20" stroke="#1f4d36" stroke-width="2"/>
      <g fill="#8b1e2b" stroke="none"><circle cx="14" cy="-14" r="2.6"/><circle cx="-16" cy="-11" r="2.6"/><circle cx="-12" cy="16" r="2.6"/><circle cx="19" cy="7" r="2.6"/></g>
      <path d="M0 18 l-8 7 l2 -9 z M0 18 l8 7 l-2 -9 z" fill="#8b1e2b" stroke="#8b1e2b" stroke-width="1.5"/>
    </g>
    <!-- מקל סוכריה -->
    <g transform="translate(196 40) rotate(14)" opacity=".2">
      <path d="M0 52 V10 a10 10 0 0 1 20 0 v4" stroke="#fbf7ec" stroke-width="7"/>
      <path d="M0 52 V10 a10 10 0 0 1 20 0 v4" stroke="#8b1e2b" stroke-width="7" stroke-dasharray="5 5"/>
      <path d="M0 52 V10 a10 10 0 0 1 20 0 v4" stroke="#8b1e2b" stroke-width="1.2" opacity=".6"/>
    </g>
    <!-- פתית שלג גדול -->
    <g transform="translate(140 150)" stroke="#1f4d36" stroke-width="1.8" opacity=".17">
      <g id="arm"><path d="M0 0 V-17 M0 -10 l-5 -5 M0 -10 l5 -5 M0 -4 l-3 -3 M0 -4 l3 -3"/></g>
      <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
    </g>
    <!-- פתיתים קטנים -->
    <g stroke="#b8913a" stroke-width="1.5" opacity=".35">
      <path d="M110 30 v10 M105 35 h10 M106.5 31.5 l7 7 M113.5 31.5 l-7 7"/>
      <path d="M238 140 v8 M234 144 h8"/>
      <path d="M24 170 v8 M20 174 h8 M21 171 l6 6 M27 171 l-6 6"/>
      <path d="M200 236 v8 M196 240 h8"/>
    </g>
    <!-- אייל -->
    <g transform="translate(46 200)" stroke="#8b1e2b" stroke-width="2" opacity=".18">
      <path d="M0 8 q10 -7 26 -2 l6 -10 l6 -2"/>
      <path d="M2 8 q-1 6 2 9 h24 q3 -4 0 -11"/>
      <path d="M6 17 v13 M12 17 v13 M22 17 v13 M27 15 v15"/>
      <path d="M38 -4 l4 3 M36 -6 l-2 -10 l-5 -4 M34 -13 l4 -4 M36 -6 l4 -9 l5 -2 M41 -12 l-1 -5"/>
      <path d="M0 8 l-4 -3"/>
    </g>
    <!-- מקל סוכריה קטן -->
    <g transform="translate(222 196) rotate(-22)" opacity=".16">
      <path d="M0 30 V7 a6 6 0 0 1 12 0 v3" stroke="#8b1e2b" stroke-width="4.5" stroke-dasharray="3.5 3.5"/>
    </g>
    <!-- זר קטן -->
    <g transform="translate(118 236)" opacity=".14">
      <circle r="11" stroke="#1f4d36" stroke-width="4.5" stroke-dasharray="2 3"/>
      <circle cx="0" cy="-11" r="2.4" fill="#8b1e2b" stroke="none"/>
    </g>
  </g>
</svg>
